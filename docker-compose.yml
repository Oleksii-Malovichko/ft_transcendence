name: ft_transcendence

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    volumes:
      # Named volume: the data survives `docker compose down` and rebuilds.
      - db-data:/var/lib/postgresql/data
    healthcheck:
      est: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── Backend (NestJS) ── internal only, no published port ──────────────────
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      API_PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy # start only once PostgreSQL accepts connections
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/api/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  # ── Frontend (Next.js) ── internal only, no published port ────────────────
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    API_INTERNAL_URL: http://api:3001
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  # ── Reverse proxy (nginx) ── the only service reachable from outside ──────
  proxy:
    build: ./infra/nginx
    restart: unless-stopped
    environment:
      HTTPS_PORT: ${HTTPS_PORT:-8443}
    ports:
      - "${HTTP_PORT:-8080}:80"
      - "${HTTPS_PORT:-8443}:443"
    volumes:
      - certs:/etc/nginx/certs
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy

volumes:
  db-data:
  certs:
