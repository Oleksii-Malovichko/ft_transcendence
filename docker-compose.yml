name: ft_transcendence

services:
  db:
    # Pinned major version: PostgreSQL data files are not compatible between
    # majors. (18 also moved the data directory inside the image, which
    # breaks most tutorials; 17 is supported until 2029.)
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    volumes:
      # Named volume: the data survives `docker compose down` and rebuilds.
      - db-data:/var/lib/postgresql/data
    healthcheck:
      # pg_isready answers "is the server accepting connections?".
      # $$ tells Compose "not my variable": the shell INSIDE the container
      # expands it. Other services will wait for "healthy" before starting.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── Backend (NestJS) ── internal only, no published port ──────────────────
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    # command: sh -c "npx prisma migrate deploy && node dist/apps/api/main"
    environment:
      API_PORT: 3001
      # Inside Compose the database host is the service name "db".
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET:?add JWT_SECRET to .env (openssl rand -hex 32)}
      UPLOADS_DIR: /app/uploads
      # Where the BROWSER reaches this site. The 42 sign-in sends the browser
      # back here, so it must be the public address (nginx), not a container.
      WEB_ORIGIN: ${WEB_ORIGIN:-https://localhost:${HTTPS_PORT:-8443}}
      # Signing in with 42 is optional: empty values simply switch it off.
      FORTY_TWO_CLIENT_ID: ${FORTY_TWO_CLIENT_ID:-}
      FORTY_TWO_CLIENT_SECRET: ${FORTY_TWO_CLIENT_SECRET:-}
      FORTY_TWO_REDIRECT_URI: ${FORTY_TWO_REDIRECT_URI:-}
    volumes:
      # Uploaded avatars live in a volume: rebuilding the image keeps them.
      - avatars:/app/uploads
    depends_on:
      db:
        condition: service_healthy # start only once PostgreSQL accepts connections
    healthcheck:
      # The image has no curl: Node's built-in fetch() makes the request.
      test:
        - CMD
        - node
        - -e
        # Quoted: "r.ok ? 0 : 1" contains ": ", which YAML would read as a key.
        - "fetch('http://127.0.0.1:3001/api/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  # ── Frontend (Next.js) ── internal only, no published port ────────────────
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      # Server-side rendering asks the API who is logged in, over Compose's
      # private network. The browser never sees this address.
      API_INTERNAL_URL: http://api:3001
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  # ── Reverse proxy (nginx) ── the only service reachable from outside ──────
  proxy:
    build: ./infra/nginx
    restart: unless-stopped
    environment:
      # Used in the HTTP → HTTPS redirect: the port the BROWSER sees.
      HTTPS_PORT: ${HTTPS_PORT:-8443}
    ports:
      - "${HTTP_PORT:-8080}:80"
      - "${HTTPS_PORT:-8443}:443"
    volumes:
      # Keeps the self-signed certificate across restarts.
      - certs:/etc/nginx/certs
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy

volumes:
  db-data:
  avatars:
  certs:
